name: CI

on:
  pull_request:
  push:
    branches:
      - production

permissions:
  contents: read
  # `bun install` resolves @dauphaihau-camille/api-spec from GitHub Packages,
  # so every job that installs needs registry read access.
  packages: read

env:
  NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
  REGISTRY_TOKEN_SOURCE: ${{ secrets.NPM_READ_TOKEN && 'NPM_READ_TOKEN' || 'GITHUB_TOKEN' }}

jobs:
  validate:
    name: Lint, typecheck, test, build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:5100
      NEXT_PUBLIC_API_VERSION: v1
      NEXT_PUBLIC_MARKETING_HOST: http://localhost:5101

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Restore Bun and Turbo caches
        uses: actions/cache@v5
        with:
          path: |
            ~/.bun/install/cache
            .turbo
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock', 'package.json', 'turbo.json') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Unit and integration tests
        run: bun run test

      - name: Build
        run: bun run build

  contract:
    name: Generated API types match the published contract
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      NODE_AUTH_TOKEN: ${{ secrets.NPM_READ_TOKEN || secrets.GITHUB_TOKEN }}
      REGISTRY_TOKEN_SOURCE: ${{ secrets.NPM_READ_TOKEN && 'NPM_READ_TOKEN' || 'GITHUB_TOKEN' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v5

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2

      - name: Verify registry access for @dauphaihau-camille
        run: |
          echo "Resolving @dauphaihau-camille/api-spec with token from ${REGISTRY_TOKEN_SOURCE}."
          status=$(curl \
            --silent \
            --output /dev/null \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer ${NODE_AUTH_TOKEN}" \
            --header 'Accept: application/vnd.npm.install-v1+json' \
            'https://npm.pkg.github.com/@dauphaihau-camille%2Fapi-spec')

          case "$status" in
            200)
              echo "Registry access confirmed."
              ;;
            401)
              echo "::error::GitHub Packages rejected the credentials (401). NPM_READ_TOKEN is unset or expired, and GITHUB_TOKEN cannot authenticate to ${GITHUB_REPOSITORY} packages from this job."
              exit 1
              ;;
            403)
              echo "::error::The token is valid but lacks read access (403) for @dauphaihau-camille/api-spec. Add read:packages or set NPM_READ_TOKEN with access to the dauphaihau-camille packages."
              exit 1
              ;;
            404)
              echo "::error::GitHub Packages returned 404. The package is not missing: this token cannot see @dauphaihau-camille/api-spec. Grant dauphaihau-camille/web read access to the package repository, or set NPM_READ_TOKEN with read:packages for the dauphaihau-camille account."
              exit 1
              ;;
            *)
              echo "::error::Unexpected response from the GitHub Packages registry (HTTP ${status})."
              exit 1
              ;;
          esac

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Check generated API types are current
        run: bun run generate:api-types -- --check
